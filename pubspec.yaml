name: bookease_app
description: "Professional Appointment Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # UI & Design
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Calendar & Date
  table_calendar: ^3.1.2
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Network Check
  connectivity_plus: ^6.1.3

  # Image Picker
  image_picker: ^1.1.2

  # URL Launcher
  url_launcher: ^6.3.1

  # PDF Receipt
  pdf: ^3.11.1
  printing: ^5.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/